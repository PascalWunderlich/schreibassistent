name: CI

on:
  push:
    branches: [main, p10-installation]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest, target: macos-arm64 }
          - { name: Windows x64, os: windows-latest, target: windows-x64 }
          - { name: Linux x64, os: ubuntu-latest, target: linux-x64 }
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Linux-Bibliotheken
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev libxdo-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Werkzeuge holen (Unix)
        if: runner.os != 'Windows'
        run: sh scripts/werkzeuge-bauen.sh ${{ matrix.target }}
      - name: Werkzeuge holen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/werkzeuge-bauen.ps1

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # Vorlage und Typst-Pakete wie beim ersten Start der App ablegen; die Rust-Tests setzen sie voraus.
      - name: Vorlage installieren
        run: cargo run --manifest-path src-tauri/Cargo.toml --example vorlage_installieren
      - name: Rust-Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Paket bauen
        run: pnpm bundle
      - uses: actions/upload-artifact@v4
        with:
          name: schreibassistent-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
