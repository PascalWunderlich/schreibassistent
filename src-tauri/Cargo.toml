[package]
name = "schreibassistent"
version = "0.1.0"
description = "Lokale Desktop-App für wissenschaftliche Arbeiten mit Typst"
authors = ["Pascal Wunderlich"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "schreibassistent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typst = "0.15.1"
typst-svg = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["datetime", "embedded-fonts", "scan-fonts", "system-packages"] }
typst-layout = "0.15.1"
typst-utils = "0.15.1"
comemo = "0.5.1"
url = "2"
tauri-plugin-dialog = "2"
typst-pdf = "0.15.1"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
biblatex = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", default-features = false, features = ["json"] }
tauri-plugin-opener = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Abhängigkeiten (v. a. Typst) auch im Dev-Build optimieren, sonst ist `pnpm tauri dev`
# für Satzmessungen unbrauchbar langsam. Der eigene Code bleibt schnell zu kompilieren.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
miniz_oxide = "0.8"
